[package]
name = "peer-relay"
version = "0.1.0"
edition = "2021"
description = "Tiny store-and-forward envelope relay for Frappe-to-Frappe P2P document transfer (plain HTTPS+JSON friendly)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tower-http = { version = "0.5", features = ["limit"] }
